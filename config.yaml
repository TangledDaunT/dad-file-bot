# Dad File Bot Configuration
# ==========================

# Approved sender (your dad's WhatsApp number)
# Format: +<country_code><number> e.g., +919876543210
approved_sender: "+919876543210"

# Root directory to scan for files (Windows path format)
# Use double backslashes or forward slashes
scan_directory: "E:\\"

# Supported file extensions
file_extensions:
  - ".pdf"
  - ".doc"
  - ".docx"

# Fuzzy matching threshold (0-100)
# Higher = stricter matching, Lower = more lenient
fuzzy_threshold: 60

# Number of results to show when multiple files match
max_results: 10

# Polling interval in seconds (how often to check for new messages)
poll_interval: 5

# Database file to store file index
index_file: "file_index.db"

# Log file location
log_file: "dad_file_bot.log"
